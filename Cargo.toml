[workspace]
resolver = "2"
members = [
    "crates/graft-sim",
    "crates/graft-core",
    "crates/graft-health",
    "crates/graft-storage",
    "crates/graft-multigroup",
    "crates/graft-reads",
    "crates/graft-blob",
    "crates/graft-node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Graft Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.9"
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.16"

graft-sim = { path = "crates/graft-sim" }
graft-core = { path = "crates/graft-core" }
graft-health = { path = "crates/graft-health" }
graft-storage = { path = "crates/graft-storage" }
graft-multigroup = { path = "crates/graft-multigroup" }
graft-reads = { path = "crates/graft-reads" }
graft-blob = { path = "crates/graft-blob" }
